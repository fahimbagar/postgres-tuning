apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Postgres treats SIGTERM as "smart" shutdown and waits for clients to
      # leave. The scenario Jobs are gone by the time we restart, so this is
      # only a safety margin.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgtune:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
          # Settings a scenario changes with ALTER SYSTEM (io_method,
          # pg_prewarm.autoprewarm, ...) must not be here: command-line
          # options override postgresql.auto.conf.
          args:
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_connections=500
            - -c
            - shared_preload_libraries=pg_stat_statements,pg_prewarm
            - -c
            - track_io_timing=on
            - -c
            - log_temp_files=0
            - -c
            - max_wal_size=4GB
          ports:
            - containerPort: 5432
          # requests == limits gives the pod Guaranteed QoS, so the numbers
          # don't depend on what else the node is doing.
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # The container default of 64MB /dev/shm is too small for
            # parallel query; Postgres fails with "could not resize shared
            # memory segment".
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 30Gi
